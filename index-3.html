<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Нормфиз-тренажёр</title>
<meta name="description" content="Учебная платформа по нормальной физиологии: теория, интерактивные графики, схемы, карточки и тесты">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Unbounded:wght@400;500;600&display=swap">
<style>
[hidden]{display:none!important}img{max-width:100%}body{margin:0}
:root{
  --bg:#F6F4F5; --surface:#FFFFFF; --surface-2:#FBF8F9; --ink:#1D1A22; --ink-2:#5F5867; --ink-3:#8B8491;
  --line:#E6DFE3; --grid:#F0DADF; --grid-strong:#E6C3CA;
  --accent:#C21F3A; --accent-ink:#9E1830; --accent-soft:#FBE7EB; --on-accent:#FFFFFF;
  --violet:#7A2B8F; --red:#D7263D; --blue:#1F6FC9; --k:#2458A6; --k-soft:#E4ECF8; --na:#B8620A; --na-soft:#FBEEDD; --good:#2D7A4E; --good-soft:#E3F2E9; --bad:#B42318;
  --shadow:0 1px 2px rgba(40,20,30,.06),0 6px 20px rgba(40,20,30,.06);
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:10px; --side:280px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#141217; --surface:#1C1920; --surface-2:#211D25; --ink:#EEE9F1; --ink-2:#ADA4B5; --ink-3:#807788;
  --line:#322C38; --grid:#2E2329; --grid-strong:#46323A;
  --violet:#C98BE3; --red:#FF5C6E; --blue:#6FA8F5; --accent:#FF5A72; --accent-ink:#FF8497; --accent-soft:#3A1C24; --on-accent:#1A0A0E;
  --k:#7AA6F2; --k-soft:#1E2A40; --na:#F0A24A; --na-soft:#3A2A16; --good:#5CC48A; --good-soft:#17301F; --bad:#FF7A6B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#141217; --surface:#1C1920; --surface-2:#211D25; --ink:#EEE9F1; --ink-2:#ADA4B5; --ink-3:#807788;
  --line:#322C38; --grid:#2E2329; --grid-strong:#46323A;
  --violet:#C98BE3; --red:#FF5C6E; --blue:#6FA8F5; --accent:#FF5A72; --accent-ink:#FF8497; --accent-soft:#3A1C24; --on-accent:#1A0A0E;
  --k:#7AA6F2; --k-soft:#1E2A40; --na:#F0A24A; --na-soft:#3A2A16; --good:#5CC48A; --good-soft:#17301F; --bad:#FF7A6B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--accent-ink)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:-.01em;text-wrap:balance;margin:0}
h4{font-size:.95rem;margin:0 0 .35rem;font-weight:650}
p{margin:.45rem 0}
ul,ol{margin:.4rem 0;padding-left:1.25rem}
li{margin:.2rem 0}
small{display:block;font-size:.78em;color:var(--ink-2);font-weight:400}

/* ---------- Каркас ---------- */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;border-right:1px solid var(--line);background:var(--surface);padding:18px 14px 28px;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);padding:4px 6px}
.brand svg{flex:none}
.brand b{font-family:var(--f-display);font-size:1.02rem;font-weight:600;line-height:1.15}
.brand span{display:block;font-size:.72rem;color:var(--ink-2);letter-spacing:.04em;text-transform:uppercase;margin-top:2px}
.nav-main{display:grid;gap:2px}
.nav a,.nav-main a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;text-decoration:none;color:var(--ink);font-size:.93rem}
.nav a:hover,.nav-main a:hover{background:var(--surface-2)}
.nav a[aria-current="page"],.nav-main a[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.nav-main a .ic{width:18px;text-align:center;font-family:var(--f-mono);font-size:.8rem;color:var(--ink-3)}
.nav-main a[aria-current="page"] .ic{color:var(--accent-ink)}
.nav h5{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin:12px 10px 4px;font-weight:600}
.nav a .n{font-family:var(--f-mono);font-size:.72rem;color:var(--ink-3);width:20px;flex:none}
.nav a[aria-current="page"] .n{color:var(--accent-ink)}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;padding:10px 28px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.menu-btn{display:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;cursor:pointer}
.search{flex:1;max-width:520px;position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px 8px 36px;font:inherit;font-size:.92rem;color:var(--ink)}
.search input::placeholder{color:var(--ink-3)}
.search::before{content:"";position:absolute;left:13px;top:50%;width:11px;height:11px;border:2px solid var(--ink-3);border-radius:50%;transform:translateY(-62%)}
.search::after{content:"";position:absolute;left:24px;top:58%;width:6px;height:2px;background:var(--ink-3);transform:rotate(45deg)}
.theme-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:.85rem;color:var(--ink-2)}
.view{padding:28px 28px 64px;max-width:1180px;width:100%}
.scrim{display:none}

/* ---------- Главная ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:center;margin-bottom:28px}
.hero h1{font-size:clamp(1.7rem,3.2vw,2.5rem);line-height:1.12}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p.sub{color:var(--ink-2);font-size:1.02rem;max-width:56ch}
.hero .trace{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px 6px;box-shadow:var(--shadow)}
.paper{background-color:var(--surface);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px),linear-gradient(var(--grid-strong) 1px,transparent 1px),linear-gradient(90deg,var(--grid-strong) 1px,transparent 1px);background-size:10px 10px,10px 10px,50px 50px,50px 50px;background-position:-1px -1px}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 16px;border-radius:999px;cursor:pointer;text-decoration:none;font-weight:550;font-size:.93rem}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{filter:brightness(1.05)}
.stats{display:flex;flex-wrap:wrap;gap:22px;margin:6px 0 30px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stats div{min-width:120px}
.stats b{display:block;font-family:var(--f-display);font-size:1.5rem;font-weight:500;font-variant-numeric:tabular-nums}
.stats span{font-size:.82rem;color:var(--ink-2)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:30px 0 12px;flex-wrap:wrap}
.sec-h h2{font-size:1.2rem}
.sec-h p{margin:0;color:var(--ink-2);font-size:.9rem}
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.gcard{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;text-decoration:none;color:var(--ink);transition:border-color .15s,transform .15s}
.gcard:hover{border-color:var(--accent);transform:translateY(-1px)}
.gcard .thumb{height:118px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden}
.gcard .thumb svg{width:100%;height:100%}
.gcard .body{padding:10px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.gcard h3{font-family:var(--f-body);font-size:.97rem;font-weight:650;line-height:1.3}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:600;letter-spacing:.03em;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);width:max-content;max-width:100%}
.tag.must{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}
.tag.sch{background:var(--k-soft);color:var(--k);border-color:transparent}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.tlink{display:grid;grid-template-columns:34px 1fr;gap:4px 10px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--ink)}
.tlink:hover{border-color:var(--ink-3)}
.tlink .n{font-family:var(--f-mono);color:var(--accent);font-size:.9rem;grid-row:span 2;padding-top:1px}
.tlink b{font-weight:600;font-size:.95rem;line-height:1.3}
.tlink span{font-size:.8rem;color:var(--ink-2)}
.bar{height:4px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px;grid-column:2}
.bar i{display:block;height:100%;background:var(--good);border-radius:4px}

/* ---------- Тема ---------- */
.crumbs{font-size:.82rem;color:var(--ink-2);margin-bottom:8px;display:flex;gap:8px;flex-wrap:wrap}
.thead h1{font-size:clamp(1.35rem,2.6vw,1.9rem);line-height:1.18;max-width:30ch}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 18px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--ink-2);font-weight:550;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-size:.93rem}
.tabs button[aria-selected="true"]{color:var(--accent-ink);border-bottom-color:var(--accent)}
.tabs button .c{font-family:var(--f-mono);font-size:.72rem;color:var(--ink-3);margin-left:4px}
.theory{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:36px}
.toc{position:sticky;top:76px;align-self:start;font-size:.85rem;border-left:1px solid var(--line);padding-left:14px}
.toc b{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin-bottom:6px}
.toc a{display:block;padding:4px 0;color:var(--ink-2);text-decoration:none;line-height:1.35}
.toc a:hover{color:var(--accent-ink)}
.prose{max-width:74ch}
.prose section{margin-bottom:34px;scroll-margin-top:80px}
.prose h2{font-size:1.18rem;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.prose .lead-in{color:var(--ink-2);font-style:italic}
.def{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;margin:12px 0}
.defh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.term{font-family:var(--f-display);font-weight:500;font-size:.98rem;color:var(--accent-ink)}
.def .off{margin:.35rem 0 0}
.def .plain{margin:.55rem 0 0;padding:8px 12px;background:var(--surface-2);border-radius:8px;color:var(--ink);font-size:.94rem}
.def .plain span{font-weight:650;color:var(--k)}
.src{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.extra{background:var(--k-soft);border-radius:var(--r);padding:12px 16px;margin:14px 0;font-size:.95rem}
.extra .src{display:block;color:var(--k);margin-bottom:4px}
.mem{background:var(--accent-soft);border-radius:var(--r);padding:12px 16px;margin:14px 0;font-size:.95rem}
.mem b:first-child{display:inline-block;font-family:var(--f-mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent-ink);margin-right:6px}
.note{font-size:.84rem;color:var(--ink-2)}
.cols2,.cols3{display:grid;gap:12px;margin:12px 0}
.cols2{grid-template-columns:repeat(2,minmax(0,1fr))}
.cols3{grid-template-columns:repeat(3,minmax(0,1fr))}
.cols2>div,.cols3>div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;font-size:.94rem}
.cols2>div>p:first-of-type,.cols3>div>p:first-of-type{margin-top:0}
ol.big>li{margin:.5rem 0}
ol.steps{counter-reset:s;list-style:none;padding:0}
ol.steps>li{counter-increment:s;position:relative;padding:6px 0 6px 40px;border-bottom:1px dashed var(--line)}
ol.steps>li::before{content:counter(s);position:absolute;left:0;top:6px;width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);font-family:var(--f-mono);font-size:.8rem;display:flex;align-items:center;justify-content:center;font-weight:600}
ul.tl{list-style:none;padding:0}
ul.tl li{padding:6px 0 6px 18px;position:relative;border-bottom:1px dashed var(--line)}
ul.tl li::before{content:"";position:absolute;left:2px;top:15px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.tblwrap{overflow-x:auto;margin:12px 0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.tbl{border-collapse:collapse;width:100%;font-size:.9rem}
.tbl th,.tbl td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl thead th,.tbl thead td{background:var(--surface-2);font-weight:650;font-size:.82rem;color:var(--ink-2)}
.tbl tbody th{font-weight:600;min-width:120px}
.tbl tr:last-child>*{border-bottom:0}
.tbl td{font-variant-numeric:tabular-nums}
.tree{margin:14px 0;display:flex;flex-direction:column;align-items:center;gap:0}
.tr-root{background:var(--ink);color:var(--bg);font-weight:650;padding:7px 16px;border-radius:8px;font-size:.92rem;position:relative}
.tr-root::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:14px;background:var(--ink-3)}
.tr-kids{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;width:100%;margin-top:14px;padding-top:12px;border-top:1px solid var(--ink-3)}
.tr-kids>div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;font-size:.9rem}
.tr-kids ul{margin:.3rem 0 0}
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px;margin:14px 0}
.flow .fi{flex:1 1 120px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.86rem;font-weight:550;display:flex;flex-direction:column;justify-content:center}
.flow .fa{align-self:center;color:var(--accent);font-weight:700}

/* ---------- Графики ---------- */
.gview{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:start}
.gpanel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;box-shadow:var(--shadow);min-width:0}
.gpanel h2{font-size:1.1rem;margin-bottom:4px}
.gpanel .lead{color:var(--ink-2);font-size:.93rem;margin:6px 0 12px;max-width:70ch}
.gpanel .must-line{font-size:.82rem;color:var(--accent-ink);font-weight:600;margin-bottom:4px}
.gcanvas{border-radius:10px;border:1px solid var(--line);padding:6px;overflow-x:auto}
.gside{display:flex;flex-direction:column;gap:14px}
.gside .blk{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.gside h3{font-family:var(--f-body);font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:650;margin-bottom:8px}
.gside ol,.gside ul{padding-left:1.1rem;font-size:.9rem}
.gside li{margin:.35rem 0}
.gsvg{width:100%;height:auto;display:block;font-family:var(--f-mono);font-size:12px;overflow:visible}
.gsvg .ax{stroke:var(--ink-2);stroke-width:1.2;fill:none}
.gsvg .grid{stroke:var(--grid);stroke-width:1}
.gsvg .tick{fill:var(--ink-2);font-size:11px}
.gsvg .axlbl{fill:var(--ink);font-size:12px;font-weight:600;font-family:var(--f-body)}
.gsvg .tr{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.gsvg .tr.thick{stroke-width:2.8}
.gsvg .tr.k{stroke:var(--k)}
.gsvg .tr.na{stroke:var(--na)}
.gsvg .tr.dash{stroke-dasharray:6 5}
.gsvg .tr.faint{stroke:var(--ink-3);stroke-width:1.4;stroke-dasharray:4 4}
.gsvg .tr.stim{stroke:var(--ink-2);stroke-width:1.6}
.gsvg .tr.emg{stroke:var(--accent);stroke-width:1}
.gsvg .tr.eegt{stroke:var(--accent);stroke-width:1.4}
.gsvg .ref{stroke:var(--ink-3);stroke-width:1.2}
.gsvg .ref.dash{stroke-dasharray:5 4}
.gsvg .ref.faint{stroke:var(--line)}
.gsvg .ref.k{stroke:var(--k)}
.gsvg .ref.na{stroke:var(--na)}
.gsvg .ref.hot{stroke:var(--accent);stroke-width:1.5;stroke-dasharray:3 3}
.gsvg .zero{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:2 3}
.gsvg .lbl{fill:var(--ink);font-size:12px;font-family:var(--f-body)}
.gsvg .lbl.small{font-size:11px}
.gsvg .lbl.strong{font-weight:650}
.gsvg .accentc{fill:var(--accent-ink)}
.gsvg .kc{fill:var(--k)}
.gsvg .nac{fill:var(--na)}
.gsvg .zone{fill:var(--accent);opacity:.07}
.gsvg .zone.alt{fill:var(--na);opacity:.1}
.gsvg .zone.k{fill:var(--k);opacity:.08}
.gsvg .zone.hot{fill:var(--accent);opacity:.16}
.gsvg .zlbl{fill:var(--ink-2);font-size:11px;font-family:var(--f-body);font-weight:600}
.gsvg .dot{fill:var(--accent);stroke:var(--surface);stroke-width:1.5}
.gsvg .dot.kf{fill:var(--k)}
.gsvg .dot.ring{fill:none;stroke:var(--ink);stroke-width:2}
.gsvg .num{fill:var(--accent);}
.gsvg .numt{fill:var(--on-accent);font-weight:700;font-size:11px}
.gsvg .arr{stroke:var(--ink-2);stroke-width:1.4}
.gsvg .stimtick{stroke:var(--ink);stroke-width:1.6}
.gsvg .stimtick.k{stroke:var(--k)}
.gsvg .bar{fill:var(--accent);opacity:.85}
.gsvg .bar.mid{fill:var(--na)}
.gsvg .bar.k{fill:var(--k)}
.gsvg .rem{fill:var(--accent);opacity:.25}
.gsvg .bg-out{fill:var(--na-soft)}
.gsvg .bg-in{fill:var(--k-soft)}
.gsvg .lipid{fill:var(--surface);stroke:var(--ink-3);stroke-width:1.2}
.gsvg .tail{stroke:var(--ink-3);stroke-width:1}
.gsvg .protein{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.gsvg .ion-na{fill:var(--na)}
.gsvg .ion-k{fill:var(--k)}
.gsvg .ionlbl{fill:#fff;font-size:10px;font-weight:700;font-family:var(--f-body)}
.gsvg .flow{fill:none;stroke:var(--ink-2);stroke-width:1.8}
.gsvg .flow.na{stroke:var(--na);stroke-width:2.2}
.gsvg .flow.k{stroke:var(--k);stroke-width:2.2}
.gsvg .flow.inh{stroke:var(--k);stroke-width:2}
.gsvg .flow.hot{stroke:var(--accent);stroke-width:2.4}
.gsvg .flow.faint{stroke:var(--ink-3);stroke-width:1.2;stroke-dasharray:4 4}
.gsvg .atp{fill:var(--good-soft);stroke:var(--good)}
.gsvg .axon{fill:var(--surface-2);stroke:var(--ink-3);stroke-width:1.2}
.gsvg .myelin{fill:var(--na-soft);stroke:var(--na);stroke-width:1.2}
.gsvg .node{fill:var(--k)}
.gsvg .exc{fill:var(--accent);opacity:.55}
.gsvg .loop{fill:none;stroke:var(--accent);stroke-width:1.6}
.gsvg .loop.faint{opacity:.5}

}

    axes(c, { yTicks: [-70, -55, -40, -20, 0], xTicks: [0, 2, 4, 6, 8], xAt: -75, yLabel: 'E, мВ', xLabel: 't, мс', yFmt: v => v === -55 ? 'Eкр₀' : fmtN(v) });

/* ===== Графики и схемы: ЦНС, сенсорные системы, ВНД ===== */
function box(svg, x, y, w, h, text, cls, sub) {
  const g = S('g', { class: 'bx ' + (cls || '') }, svg);
  S('rect', { x, y, width: w, height: h, rx: 8 }, g);
  const lines = text.split('\n');
  const lh = 15, y0 = y + h / 2 - (lines.length - 1) * lh / 2 + 4 - (sub ? 6 : 0);
  lines.forEach((l, i) => S('text', { x: x + w / 2, y: y0 + i * lh, 'text-anchor': 'middle', class: 'bxt' }, g, l));
  if (sub) S('text', { x: x + w / 2, y: y0 + lines.length * lh, 'text-anchor': 'middle', class: 'bxs' }, g, sub);
  return g;
}
function ar(svg, d, cls, lab, lx, ly, anchor) {
  const p = S('path', { d, class: 'flow ' + (cls || ''), 'marker-end': cls && cls.includes('inh') ? 'url(#arrT)' : 'url(#arrA)' }, svg);
  if (lab) S('text', { x: lx, y: ly, class: 'lbl small ' + (cls && cls.includes('inh') ? 'kc' : ''), 'text-anchor': anchor || 'middle' }, svg, lab);
  return p;
}
function neuron(svg, x, y, r, cls, label, lpos) {
  S('circle', { cx: x, cy: y, r: r || 14, class: 'nrn ' + (cls || '') }, svg);
  if (label) S('text', { x: x + (lpos === 'l' ? -20 : lpos === 'r' ? 20 : 0), y: lpos === 'b' ? y + 30 : lpos === 't' ? y - 22 : y + 4, class: 'lbl small', 'text-anchor': lpos === 'l' ? 'end' : lpos === 'r' ? 'start' : 'middle' }, svg, label);
}

function boxNum(c, x, y, n, layer) {

function chips(ctl, items, on, start) {
  const bar = H('div', { class: 'phases' }, ctl);
  items.forEach((t, i) => { const b = H('button', { type: 'button', class: 'chip' }, bar, t); b.addEventListener('click', () => { [...bar.children].forEach((x, j) => x.setAttribute('aria-pressed', i === j ? 'true' : 'false')); on(i); }); });
  if (start !== undefined) bar.children[start].click();
  return bar;
}

const EXPL = {
  pump: `<p><b>Как читать.</b> Розовая полоса сверху — снаружи клетки, голубая снизу — внутри. Насос стоит в мембране и работает «против течения»: выкачивает Na⁺ туда, где его и так много, и закачивает K⁺ туда, где его и так много. Поэтому нужна энергия — АТФ.</p><p><b>Главная мысль:</b> за один цикл наружу уходит 3 «+», а внутрь входит 2 «+» — внутри становится на один «+» меньше, т.е. насос сам немного делает внутреннюю сторону отрицательной (электрогенность). Но его основная роль — поддерживать градиенты, без которых не будет ни МПП, ни ПД.</p>`,
  mpp: `<p><b>Как читать.</b> По вертикали — заряд внутренней стороны мембраны (мВ), по горизонтали — время. Ноль — это «нет разницы зарядов». Линия МПП идёт ровно и НИЖЕ нуля: в покое внутри клетки минус, и он не меняется со временем — поэтому прямая.</p><p><b>Пунктир E_K</b> — где был бы потенциал, если бы мембрана пропускала только K⁺. МПП лежит чуть выше (≈ −70 против −90), потому что немного Na⁺ всё-таки подтекает внутрь.</p><p><b>Поиграй ползунками:</b> добавь K⁺ снаружи — линия поднимется к нулю (деполяризация, как при гиперкалиемии). Увеличь P_Na — тоже деполяризация. Именно это спрашивают в задачах 2 и 3.</p>`,
  depol: `<p><b>Как читать.</b> Ровная чёрная линия — МПП (ПП). Красный «горбик» вверх — потенциал стал ближе к нулю: <b>деполяризация</b> (заряд мембраны уменьшился). Фиолетовый спуск обратно — <b>реполяризация</b>. Синяя «ямка» вниз — потенциал стал дальше от нуля: <b>гиперполяризация</b> (заряд увеличился), и снова фиолетовая реполяризация.</p><p><b>Запоминалка:</b> «де-» — заряд убывает (к нулю), «гипер-» — заряд сверх нормы (от нуля), «ре-» — возврат.</p>`,
  ap: `<p><b>Как читать верхний график.</b> Слева ровная линия E₀ — покой. Потом медленный пологий подъём до пунктира Екр — это локальный ответ (на слайде он не подписан, в тетрадях его называют «предпороговой деполяризацией»). Дойдя до Екр, кривая почти вертикально взлетает выше нуля — <b>фаза 1</b>. Вершина — пик (спайк). Спуск вниз — <b>фаза 2</b>. Между Екр и E₀ спуск становится пологим — <b>фаза 3</b> (следовая деполяризация). Небольшая «ямка» ниже E₀ — <b>фаза 4</b> (следовая гиперполяризация), потом возврат к покою.</p><p><b>Как читать нижний график.</b> Это «сколько дверей открыто» для каждого иона. Оранжевая gNa⁺ — высокий узкий пик ровно в момент фазы 1: Na⁺ врывается и поднимает потенциал. Синяя gK⁺ — пик позже и ниже, но очень длинный «хвост»: K⁺ выходит и опускает потенциал (фаза 2), а пока хвост не закончился, мембрана «перелетает» ниже покоя (фаза 4).</p><p><b>Одной фразой:</b> вверх тянет Na⁺, вниз — K⁺, а следовые потенциалы — это медленно закрывающиеся K⁺-каналы.</p>`,
  local: `<p><b>Как читать.</b> Внизу (Б) три одинаковых по длительности прямоугольника — три стимула разной силы. Вверху (А) — что каждый из них сделал с мембраной; цвет совпадает.</p><ul><li><b>Чёрный (слабый, &lt; 50 % порога)</b> — крошечный горбик: мембрана пассивно зарядилась и сразу вернулась. Это электротон.</li><li><b>Фиолетовый (50–99 %)</b> — горбик побольше, почти до КУД: открылась часть Na⁺-каналов, но лавины нет. Это локальный ответ — он «местный», не бежит по волокну.</li><li><b>Красный (порог)</b> — дошёл до КУД → взлёт выше нуля → ПД.</li></ul><p><b>Главная мысль:</b> пока стимул ниже порога, ответ растёт вместе со стимулом (градуально). Как только КУД достигнут — появляется ПД полной высоты.</p>`,
  sd: `<p><b>Как читать.</b> Каждая точка кривой — пара «сколько мА и сколько мс нужно, чтобы возбудить ткань». Над кривой — стимулы, которые вызывают возбуждение, под кривой — которые не вызывают.</p><ul><li>Справа кривая почти горизонтальна и ложится на уровень <b>B</b>: слабее реобазы (AB) ткань не возбудить никаким временем.</li><li>Слева кривая уходит вертикально вверх у точки <b>C</b>: короче AC не поможет никакая сила (абсолютный порог времени).</li><li>Где кривая «легла» на реобазу — опускаем перпендикуляр <b>D</b>: AD — полезное время.</li><li>Удваиваем силу (AF = 2 AB), смотрим, где этот уровень пересёк кривую, опускаем <b>E</b>: AE — хронаксия.</li></ul><p><b>Сравнение тканей:</b> чем кривая левее и ниже, тем ткань возбудимее. Режим «Нерв и мышца» показывает: у нерва реобаза меньше и хронаксия короче.</p>`,
  accom: `<p><b>Как читать.</b> Внизу — МПП, вверху — ноль. Прямые 1, 2, 3 — как деполяризуется мембрана при стимулах с разной крутизной: 1 — ток нарастает быстро, 3 — медленно. Пунктир Ек — критический уровень: при медленной деполяризации он сам ползёт вверх (Na⁺-каналы инактивируются).</p><p><b>Где прямая пересекла пунктир — там возникает ПД.</b> Прямая 1 пересекает рано и низко — ПД легко. Прямая 2 — позже и выше: ПД есть, но возбудимость уже ниже. Прямая 3 нарастает так медленно, что Ек всё время «убегает» от неё, — пересечения нет, ПД нет. Это и есть аккомодация.</p>`,
  excit: `<p><b>Как читать.</b> Это два графика, совмещённых по времени: сверху ПД, снизу — уровень возбудимости (пунктир 100 % — исходная возбудимость в покое). Пунктирные вертикали показывают, какой фазе ПД соответствует какое изменение возбудимости.</p><ul><li>Локальный ответ → возбудимость чуть выше 100 % (до Екр уже ближе).</li><li>Спайк → глубокий провал до нуля: <b>абсолютная рефрактерность</b>, клетку не возбудить ничем.</li><li>Конец реполяризации → подъём от нуля к 100 %: <b>относительная рефрактерность</b>, нужен сверхпороговый стимул.</li><li>Следовая деполяризация → выше 100 %: <b>супернормальность (экзальтация)</b>.</li><li>Следовая гиперполяризация → ниже 100 %: <b>субнормальность</b>.</li></ul><p><b>Стрелки сверху:</b> синяя — стимул в покое (обычный ответ), красная — во время гиперполяризации (нужен стимул сильнее). В тетради задание так и звучит: «сопоставить фазы ПД с фазами изменения возбудимости» — пронумеруй фазы на обоих графиках одними цифрами.</p>`,
  lab: `<p><b>Как читать.</b> Верхний ряд — стимулы, которые мы «навязываем» с выбранной частотой. Ниже — какие из них ткань успела воспроизвести. После каждого ПД ткань какое-то время рефрактерна; если следующий стимул попал в эту паузу — ответа нет.</p><p><b>Подвигай частоту:</b> до 200 Гц и мышца, и нерв отвечают на каждый стимул. Выше 200 Гц мышца начинает пропускать (её рефрактерность 5 мс), нерв держится до 1000 Гц (рефрактерность 1 мс). Это и есть их лабильность.</p>`,
  aon: `<p><b>Как читать.</b> По горизонтали — стимулы по возрастанию силы: п/п (подпороговый), п (пороговый), с/п (сверхпороговые). По вертикали — величина ответа клетки (ПД). Над п/п точки нет — ПД не возник. Над п и над всеми с/п точки на одной высоте — ПД всегда одинаковый, максимальный.</p><p><b>Чем отличается от ткани:</b> у ткани точки растут, а потом выходят на плато; у клетки — сразу «ступенька» на максимум. Причина — при Екр открываются ВСЕ Na⁺-каналы.</p>`,
  gradcell: `<p><b>Как читать.</b> Те же оси и подписи, но по горизонтали теперь не сила, а <b>крутизна</b> нарастания стимула. Точки идут по прямой вверх: чем резче нарастает стимул, тем больше ответ клетки. Самый большой ответ — при прямоугольном импульсе (нарастание мгновенное). Слишком медленный стимул ответа не даст вовсе — это аккомодация.</p>`,
  force: `<p><b>Как читать.</b> По горизонтали — сила стимула по возрастанию, по вертикали — ответ всей ткани (например, высота сокращения мышцы). На п/п ответа нет. На пороговый — маленький ответ. Дальше точки поднимаются (субмаксимальные), на максимальном достигают «потолка», а супермаксимальные — на той же высоте.</p><p><b>Почему так:</b> полоски под графиком — 16 волокон с разными порогами. Двигай силу: загорается всё больше волокон — ответ растёт; когда загорелись все, расти больше некуда.</p>`,
  optpes: `<p><b>Как читать.</b> По горизонтали — частота раздражения нерва, по вертикали — сила тетанического сокращения. Сначала с ростом частоты ответ растёт — до вершины (<b>оптимум</b>: каждый импульс попадает в фазу повышенной возбудимости). Если частоту увеличивать дальше, ответ падает (<b>пессимум</b>: импульсы попадают в рефрактерность, мембрана «застревает» в деполяризации).</p>`,
  twitch: `<p><b>Как читать.</b> Стрелка «стимул» — момент раздражения. Кривая — высота сокращения мышцы во времени. Сразу после стимула кривая ещё лежит на нуле — <b>латентный период</b> (идёт ПД и выход Ca²⁺). Потом подъём до вершины — <b>укорочение</b>. Потом спуск — <b>расслабление</b> (оно длиннее подъёма).</p><p><b>Синяя кривая внизу</b> — ПД мышечного волокна: он кончается ещё в латентном периоде. Значит, когда мышца сокращается, она уже снова возбудима — поэтому новые стимулы могут «наслаиваться» и давать тетанус.</p>`,
  tetanus: `<p><b>Как читать.</b> Стрелки внизу — стимулы, кривая — сила мышцы; пунктир «одиночное» — высота одного сокращения. Всё решает, куда попал следующий стимул:</p><ul><li>после полного расслабления → ряд отдельных одиночных сокращений;</li><li>в <b>фазу расслабления</b> → мышца не успела расслабиться, новое сокращение начинается «с горки» — кривая-пила, <b>зубчатый тетанус</b> (неполная суммация);</li><li>в <b>фазу укорочения</b> → мышца не начинает расслабляться — ровное плато, <b>гладкий тетанус</b> (полная суммация), в 2–4 раза выше одиночного.</li></ul>`,
  lt: `<p><b>Как читать.</b> По горизонтали — длина саркомера, по вертикали — сила. Кривая — «колокол»: максимум при 2,0–2,2 мкм. Схема саркомера внизу показывает почему: при оптимальной длине каждая головка миозина (красные) достаёт до актина (синие). Если саркомер сжат — нити мешают друг другу, если растянут — головкам не за что цепляться.</p>`,
  work: `<p><b>Как читать.</b> Синяя прямая — на какую высоту мышца поднимает груз: чем тяжелее, тем ниже. Красная «горка» — работа (груз × высота) = площадь закрашенного прямоугольника. Без груза работа 0 (нечего поднимать), с предельным грузом — тоже 0 (не поднимает). Максимум — посередине: правило средних нагрузок.</p>`,
  emg: `<p><b>Как читать.</b> Это запись электрической активности мышцы с кожи. Узкая полоска в начале — покой: небольшая активность даже без движения (мышечный тонус). Четыре «вспышки» — четыре сжатия кисти, каждое сильнее предыдущего: амплитуда растёт, потому что включается всё больше двигательных единиц и они разряжаются чаще. Синяя линия — огибающая (интегрированная ЭМГ).</p>`,
  fibers: `<p><b>Как читать.</b> Каждая полоска — диапазон скорости проведения для типа волокна. Сверху вниз волокна становятся тоньше и теряют миелин — и проводят всё медленнее: от ≈ 100 м/с у Aα до ≈ 1 м/с у C. Таблицу можно скрыть и проверить себя — это Таблица 5 тетради.</p>`,
  salt: `<p><b>Как читать.</b> Красное — возбуждённый участок (снаружи «−»), петли со стрелкой — местные токи к соседнему невозбуждённому участку. В безмиелиновом волокне (сверху) ток доходит только до соседнего участка — возбуждение «ползёт». В миелиновом (снизу) под миелином ток не теряется и сразу доходит до следующего перехвата Ранвье — возбуждение «прыгает». Запусти анимацию и сравни, как далеко уходит импульс за одно время.</p>`,
  srv: `<p><b>Как читать.</b> Две записи М-ответа: от точки у запястья (S1) и от точки выше (S2). Короткий штрих — момент стимула, пунктир — начало ответа. От S2 импульсу идти дальше, поэтому ответ начинается позже. Разница латентностей (L2 − L1) — время, за которое импульс прошёл отрезок D между точками. Скорость = D / (L2 − L1).</p>`
};

function D(term, off, plain, src) {
  return `<div class="def"><div class="defh"><b class="term">${term}</b><span class="src">${src || 'лекция'}</span></div><p class="off">${off}</p>${plain ? `<p class="plain"><span>Простыми словами:</span> ${plain}</p>` : ''}</div>`;
}
/* X — дополнение из учебника */
function X(src, html) { return `<aside class="extra"><span class="src">${src}</span>${html}</aside>`; }
/* M — «запомни» */
function M(html) { return `<div class="mem"><b>Запомни</b> ${html}</div>`; }
/* F — схема-поток */
function F(items, cls) { return `<div class="flow ${cls || ''}">${items.map(i => `<div class="fi">${i}</div>`).join('<div class="fa" aria-hidden="true">→</div>')}</div>`; }

<p><b>Предмет физиологии</b> — функции живого организма, их связь между собой, регуляция, приспособление к внешней среде, происхождение и становление функций в эволюции и индивидуальном развитии.</p>
<div class="cols3">
<div><h4>Общая</h4><p>Основные жизненные процессы: метаболизм, свойства мембран, общие закономерности реагирования на среду.</p></div>

<div><h4>Прикладная</h4><p>Деятельность организма в особых условиях: спорт, питание, космос, экология.</p></div>
</div>
<p><b>Нормальная физиология</b> учит будущего врача механизмам работы органов и организма — это основа клинического мышления и функциональной диагностики. <b>Патологическая</b> изучает нарушения жизнедеятельности, <b>клиническая</b> — связывает фундаментальные и клинические науки, изучает компенсацию нарушенных функций.</p>
<h4>История — кого назвать на занятии</h4>
<ul class="tl">
<li><b>Гиппократ</b> — «Физиология — служанка медицины». <b>Гален</b> (II в.) — физиология как «основа медицины».</li>
<li><b>Уильям Гарвей</b> (1628) — открыл кровообращение; с него начинается экспериментальная физиология.</li>
<li><b>Альбрехт Галлер</b> — 8-томные «Элементы физиологии»; <b>Иоганнес Мюллер</b>.</li>
<li><b>И.М. Сеченов</b> — «отец русской физиологии»: центральное торможение (1862), «Рефлексы головного мозга» (1863).</li>
<li><b>И.П. Павлов</b> — учение об условных рефлексах и ВНД, Нобелевская премия 1904 г. (за работы по пищеварению).</li>
<li><b>Н.Е. Введенский</b> — лабильность, парабиоз, оптимум и пессимум. <b>А.А. Ухтомский</b> — доминанта. <b>П.К. Анохин</b> — функциональная система. <b>Л.А. Орбели</b> — адаптационно-трофическая функция симпатической нервной системы.</li>

<div class="cols2">
<div><h4>Ответные реакции</h4><ul><li>нервная клетка — проведение нервного импульса;</li><li>мышечная — сокращение;</li><li>секреторная — синтез и выделение вещества.</li></ul></div>
<div><h4>Компоненты возбуждения</h4><ul><li>химический (обмен веществ);</li><li>физико-химический (ионная проницаемость);</li><li>физический (электрические, тепловые, механические проявления);</li><li>физиологический (изменение функциональных свойств, например возбудимости).</li></ul></div>

${X('учебник', '<b>Классификация раздражителей.</b> По природе: физические (электрические, механические, температурные, световые), химические, физико-химические (осмотические, pH), биологические. По биологическому значению: <b>адекватные</b> — к которым рецептор приспособлен эволюционно (свет для глаза), и <b>неадекватные</b> (удар по глазу → «искры»). По силе: подпороговые, пороговые, сверхпороговые. В эксперименте чаще всего используют электрический ток — его легко дозировать по силе, длительности и крутизне, и он мало повреждает ткань.')}` },

<div class="cols2">
<div><h4>Липиды</h4><p>Фосфолипиды (фосфатидилхолин — лецитин, фосфатидилэтаноламин, фосфатидилсерин, фосфатидилинозит), кардиолипин, сфингомиелин, холестерол, гликолипиды. Бислой непроницаем для ионов и воды-растворимых веществ — это «изолятор».</p></div>

    { h: 'Виды транспорта через мембрану', body: `

<div><h4>Первый опыт Гальвани (1791)</h4><p>Препарат задних лапок лягушки подвешивали на медном крючке; лапки касались железа (в практикуме — цинковой пластинки) → мышцы сокращались. Гальвани решил, что это «животное электричество».</p><p><b>А. Вольта</b> возразил: ток возникает между двумя разными металлами, а лапка лишь его регистрирует. Так появился Вольтов столб — первый источник тока.</p></div>
<div><h4>Второй опыт Гальвани</h4><p>Без металлов: седалищный нерв набрасывают стеклянным крючком так, чтобы он касался повреждённого и неповреждённого участков мышцы → мышца сокращается. Доказал существование <b>тока покоя</b>.</p><h4>Опыт Маттеуччи — вторичный тетанус</h4><p>Нерв второго препарата кладут на мышцу первого. Раздражают нерв первого → сокращаются <b>обе</b> мышцы: токи действия первой мышцы раздражают нерв второго. Доказал существование <b>тока действия</b>.</p></div>
</div>

<p><b>Мембранно-ионная теория</b> (Ходжкин, Хаксли, Катц, 1949–1952; Нобелевская премия 1963): МПП возникает благодаря направленному движению заряженных частиц — в основном диффузии K⁺ из клетки наружу. Важны простая диффузия и первично-активный транспорт.</p>
<h4>Три причины МПП</h4>
<ol class="big">

<p><b>Функции сенсорных систем:</b> 1) обнаружение сигналов; 2) различение сигналов; 3) кодирование информации; 4) передача и преобразование; 5) опознание (осознание) образов.</p>

<p><b>Клеточная рецепция</b> — восприятие химического сигнала и запуск внутриклеточных реакций; <b>сенсорная рецепция</b> — преобразование энергии стимула в нервные импульсы.</p>

<div class="cols2">
<div><h4>Первый опыт Гальвани (слайд 9)</h4><p>Препарат задних лапок лягушки подвешивают на медном крючке так, чтобы лапки касались цинковой (в опыте Гальвани — железной) пластинки → мышцы сокращаются.</p><p class="hint-plain">Гальвани решил, что это «животное электричество». <b>Вольта</b> (слайд 10) показал: ток возникает между двумя РАЗНЫМИ металлами, а лапка лишь «индикатор»; так он изобрёл Вольтов столб — металлические диски, разделённые кружками мокрой ткани.</p></div>
<div><h4>Второй опыт Гальвани (слайд 11)</h4><p>Без металла: нерв набрасывают на мышцу так, чтобы он касался повреждённого и неповреждённого участков → мышца сокращается.</p><p class="hint-plain">Металла нет — значит, ток создаёт сама ткань. Так доказали существование тока покоя.</p>

      `<p>Характер ответа определяют: <b>1)</b> параметры раздражителя и <b>2)</b> функциональное состояние биосистемы. Влияние параметров описывается тремя законами раздражения: <b>закон силы, закон времени, закон градиента нарастания силы во времени</b>.</p><p><b>Клетка:</b> для возникновения возбуждения должны быть достаточными сила, время и крутизна; законы силы и времени действуют по принципу <b>«всё или ничего»</b>; закон градиента проявляется в линейной зависимости с максимумом при прямоугольном импульсе.</p><p><b>Ткань:</b> законы силы и времени действуют по принципу <b>«силовых отношений»</b> — подпороговые, пороговые, сверхпороговые (субмаксимальные, максимальный, супермаксимальные) раздражители. Графики: <a href="#g-aon">«всё или ничего»</a>, <a href="#g-force">«силовые отношения»</a>.</p>`, 0]

  t5: { z: 'Занятие 4 (вопросы 2–8)', items: [
    ['2. Понятие о скелетных мышечных волокнах, их классификация. Двигательные единицы. Свойства и функции скелетных мышц.',
      `<p><b>Мышечные волокна</b> (лекция «Мышечный тонус»): <b>тонические</b> (красные, I типа — много митохондрий, миоглобина) и <b>фазные</b> (белые, II типа — много миофибрилл, гликогена, мало миоглобина). Все скелетные мышцы — смешанные. По учебнику: I — медленные окислительные, IIa — быстрые окислительно-гликолитические, IIb(x) — быстрые гликолитические.</p><p><b>Двигательная единица</b> — α-мотонейрон + группа мышечных волокон. ДЕ медленные (малые мотонейроны, 5–10 имп/с, малая лабильность, почти не утомляются; их больше в антигравитационных мышцах) и быстрые.</p><p><b>Свойства:</b> возбудимость, проводимость, сократимость, растяжимость, эластичность, лабильность (≈ 200 имп/с). <b>Функции:</b> движение и поза, дыхание, речь, теплопродукция, депо, мышечный насос.</p>`, 0],
    ['3. Саркомер — функциональная единица сократительного элемента мышечного волокна.',
      `<p><b>Саркомер</b> — участок миофибриллы между двумя Z-пластинками (≈ 2,0–2,5 мкм). В центре — толстые нити <b>миозина</b> (диск A), от Z-пластинок — тонкие нити <b>актина</b> с тропомиозином и тропонином (диск I). При сокращении нити скользят: Z-пластинки сближаются, укорачиваются диск I и зона H, <b>диск A не меняется</b>. Сила максимальна при длине саркомера 2,0–2,2 мкм — <a href="#g-lt">график</a>.</p>`, 1],
    ['4. Механизм мышечного сокращения (электромеханическое сопряжение).',
      `<p>ПД сарколеммы → по <b>Т-трубочкам</b> вглубь волокна → дигидропиридиновые рецепторы → открытие рианодиновых каналов <b>саркоплазматического ретикулума</b> → выход <b>Ca²⁺</b> (10⁻⁷ → 10⁻⁵ моль/л) → Ca²⁺ + <b>тропонин C</b> → сдвиг тропомиозина → головки миозина прикрепляются к актину, «гребок», отсоединение за счёт <b>АТФ</b> (скольжение нитей) → расслабление: Ca²⁺-АТФаза закачивает Ca²⁺ обратно в СР.</p>`, 2],
    ['5. Типы мышечных сокращений в зависимости от условий сокращения.',
      `<p><b>Изотоническое</b> — мышца укорачивается при постоянном напряжении; <b>изометрическое</b> — напряжение растёт при постоянной длине; <b>ауксотоническое</b> (смешанное) — меняются и длина, и напряжение (естественные движения). Также концентрическое (с укорочением) и эксцентрическое (с удлинением под нагрузкой).</p>`, 3],
    ['6. Виды мышечных сокращений в зависимости от частоты стимуляции.',

    ['7. Сила мышц. Зависимость работы мышц от величины нагрузки.',

  /* ---------- Карточки ---------- */
  let deckSel = 'all';
  function cardsUI(host, fixed, inTopic) {
    const wrap = H('div', { class: 'fc-wrap' }, host);
    let deck, queue, cur, flipped = false, sessionDone = 0;
    function build() {
      const sel = fixed || deckSel;
      let pool = allCards();
      if (sel === 'unknown') pool = pool.filter(c => !known.has(c.id));
      else if (sel !== 'all') pool = pool.filter(c => c.t === sel);
      deck = pool;
      queue = pool.filter(c => !known.has(c.id));
      for (let i = queue.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [queue[i], queue[j]] = [queue[j], queue[i]]; }
      sessionDone = 0; draw();
    }
    function draw() {
      const kn = deck.filter(c => known.has(c.id)).length;
      cur = queue[0]; flipped = false;
      wrap.innerHTML = `<div class="fc-top">${fixed ? `<b>${TMAP[fixed].short}: ${deck.length} карточек</b>` : `<label class="tgl" for="deck">Колода</label><select id="deck"><option value="all">Все темы (${allCards().length})</option><option value="unknown">Только невыученные</option>${TOPICS.map(t => `<option value="${t.id}">${t.n}. ${t.short} (${t.cards.length})</option>`).join('')}</select>`}
        <span class="note">Выучено ${kn} из ${deck.length}</span></div>
        <div class="fc-prog"><i style="width:${deck.length ? kn / deck.length * 100 : 0}%"></i></div>
        ${cur ? `<div class="fc" tabindex="0" role="button" aria-label="Перевернуть карточку"><div class="fc-in"><div class="fc-f"><span class="lab">${TMAP[cur.t].short} · вопрос</span><div class="q">${cur.q}</div><span class="hint">нажми, чтобы перевернуть</span></div><div class="fc-b"><span class="lab">ответ</span><div class="a">${cur.a}</div></div></div></div>
        <div class="fc-actions"><button class="btn no" type="button" data-a="again">Повторить позже</button><button class="btn" type="button" data-a="flip">Перевернуть</button><button class="btn yes" type="button" data-a="know">Знаю</button></div>
        <p class="note" style="text-align:center">Клавиши: <span class="kbd">пробел</span> перевернуть · <span class="kbd">←</span> повторить · <span class="kbd">→</span> знаю</p>` :
          `<div class="fc-done"><h3>Колода пройдена</h3><p>Все карточки отмечены как выученные${sessionDone ? ` (за эту сессию — ${sessionDone})` : ''}.</p><div class="cta" style="justify-content:center"><button class="btn" type="button" data-a="reset">Начать колоду заново</button>${inTopic ? `<a class="btn pri" href="#${fixed}-q">Пройти тест по теме</a>` : ''}</div></div>`}`;
      const sel = $('#deck', wrap); if (sel) { sel.value = deckSel; sel.addEventListener('change', () => { deckSel = sel.value; build(); }); }
      const fc = $('.fc', wrap);
      if (fc) fc.addEventListener('click', flip);
      wrap.querySelectorAll('[data-a]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); act(b.dataset.a); }));
    }
    function flip() { flipped = !flipped; const fc = $('.fc', wrap); if (fc) fc.classList.toggle('flip', flipped); }
    function act(a) {
      if (a === 'flip') return flip();
      if (a === 'reset') { deck.forEach(c => known.delete(c.id)); saveKnown(); return build(); }
      if (!cur) return;
      queue.shift();
      if (a === 'know') { known.add(cur.id); saveKnown(); sessionDone++; }
      else queue.splice(Math.min(queue.length, 3), 0, cur);
      draw();
    }
    wrap._key = e => {
      if (!document.body.contains(wrap) || /INPUT|SELECT|TEXTAREA/.test(document.activeElement && document.activeElement.tagName)) return;
      if (e.key === ' ') { e.preventDefault(); flip(); } else if (e.key === 'ArrowRight') act('know'); else if (e.key === 'ArrowLeft') act('again');
    };
    keyHandler = wrap._key;
    build();
  }

  const WB = [
    ['Занятие 1 · Введение. Транспорт через мембрану. Ионные каналы', [['q', 'Вопросы для самоподготовки — с ответами', '#t1'], ['d', 'Дать определения: раздражитель, раздражимость, возбудимость, возбуждение', '#t1'], ['g', 'Работа 1, задание 1 · обозначить части структуры мембраны (рис. 1)', '#g-membrane'], ['d', 'Работа 1, задание 2 · функции мембраны', '#t1'], ['d', 'Работа 1, задание 3 · определения механизмов транспорта и примеры', '#t1'], ['g', 'Работа 1, задание 4 · схема типов транспорта ионов через мембрану', '#g-iontr'], ['g', 'Na⁺/K⁺-АТФаза (первично-активный транспорт)', '#g-pump'], ['d', 'Работа 1, задание 5 · типы ионных каналов по механизму регуляции и примеры', '#t1'], ['q', 'Вклад отечественных физиологов', '#t1']]],
    ['Занятие 2 · Биотоки. Потенциал покоя и потенциал действия', [['q', 'Вопросы для самоподготовки — с ответами', '#t2'], ['g', 'Отметить на координатной плоскости МПП аксона и перечислить причины', '#g-mpp'], ['g', 'Деполяризация и гиперполяризация (слайд 33)', '#g-depol'], ['g', 'Нарисовать график ПД, обозначить фазы', '#g-ap'], ['d', 'Определения: возбудимость, проводимость, лабильность', '#t2'], ['d', 'Работы 2–4: нервно-мышечный препарат, 1-й опыт Гальвани, вторичный тетанус', '#t2'], ['t', 'Ситуационные задачи 1–6', '#t2-z']]],
    ['Занятие 3 · Биофизические основы возбудимости. Условия возникновения возбуждения', [['q', 'Вопросы для самоподготовки — с ответами', '#t3'], ['g', 'Кривая «сила–длительность»: реобаза, полезное время, хронаксия (Работа 6)', '#g-sd'], ['g', 'График изменения возбудимости во время возбуждения; сопоставить фазы ПД с фазами возбудимости', '#g-excit'], ['g', 'Лабильность и её мера', '#g-lab'], ['g', 'Аккомодация — градиент нарастания силы', '#g-accom'], ['g', 'Электротон, локальный ответ и ПД (слайд 5)', '#g-local'], ['d', 'Работа 5 · пороги нерва и мышцы, вывод: возбудимость нерва выше', '#t3'], ['t', 'Задача 7 (ток 50 Гц и 500 кГц)', '#t3-z']]],
    ['Занятие 4 · Законы раздражения. Физиология мышц', [['q', 'Вопрос 1 (законы раздражения) — с ответом', '#t4'], ['q', 'Вопросы 2–8 (мышцы) — с ответами', '#t5'], ['g', 'График «всё или ничего» для клетки', '#g-aon'], ['g', 'График «силовых отношений» для ткани', '#g-force'], ['g', 'Закон градиента для клетки (слайд 12)', '#g-gradcell'], ['g', 'Кривая одиночного мышечного сокращения с фазами', '#g-twitch'], ['g', 'Неполная суммация и зубчатый тетанус; полная суммация и гладкий тетанус', '#g-tetanus'], ['g', 'Оптимум и пессимум', '#g-optpes'], ['g', 'Работа мышцы и правило средних нагрузок', '#g-work'], ['g', 'Работа 7 · электромиограмма', '#g-emg'], ['d', 'Волокна, ДЕ, саркомер, электромеханическое сопряжение, типы сокращений, утомление, гладкие мышцы', '#t5'], ['t', 'Задача 8 (перерезать нерв без сокращения)', '#t4-z'], ['t', 'Задачи 9 и 11 (кальций; разные ДЕ)', '#t5-z']]],
    ['Занятие 5 · Физиология нервов', [['q', 'Вопросы для самоподготовки — с ответами', '#t6'], ['g', 'Таблица 5: скорость проведения по волокнам разных типов и функции', '#g-fibers'], ['g', 'Механизм проведения в миелиновых и безмиелиновых волокнах', '#g-salt'], ['d', 'Законы проведения возбуждения по нерву и их клиническое значение', '#t6'], ['g', 'Работа 8 · расчёт скорости проведения по локтевому нерву', '#g-srv'], ['t', 'Задача 10 (суммарный ПД нерва)', '#t6-z']]]
  ];
  function viewWB() {
    setActive('wb');
    const kn = { g: 'график', d: 'теория', t: 'задачи', q: 'вопрос' };
    view.innerHTML = `<div class="sec-h" style="margin-top:0"><h2>Задания рабочей тетради</h2><p>«Нормальная физиология. От теории к практике» — что где разобрано</p></div>
      <div class="wb">${WB.map(([h, items]) => `<div class="wb-z"><h3>${h}</h3><ul>${items.map(([k, t, href]) => `<li><span class="k k-${k}">${kn[k]}</span><a href="${href}">${t}</a></li>`).join('')}</ul></div>`).join('')}</div>
      <div class="sec-h"><h2>Все ситуационные задачи с ответами</h2><p>Сначала реши сам, потом открывай</p></div>
      ${TOPICS.flatMap(t => t.tasks).map(taskHTML).join('')}`;
  }

  /* ---------- Поиск ---------- */
  const IDX = [];
  TOPICS.forEach(t => {
    t.sections.forEach((s, i) => IDX.push({ href: '#' + t.id, jump: t.id + 's' + i, title: s.h, sub: t.short, text: strip(s.body) }));
    t.cards.forEach(c => IDX.push({ href: '#' + t.id + '-c', title: c[0], sub: t.short + ' · карточка', text: c[1] }));
  });
  if (typeof QA !== 'undefined') Object.keys(QA).forEach(tid => QA[tid].items.forEach(([q, a]) => IDX.push({ href: '#' + tid, jump: tid + 'qa', title: q, sub: TMAP[tid].short + ' · вопрос тетради', text: strip(a) })));
  GIDS.forEach(id => IDX.push({ href: '#g-' + id, title: G[id].title, sub: 'график', text: G[id].lead + ' ' + (G[id].keys || []).join(' ') }));
  let searchT;
  $('#q').addEventListener('input', e => { clearTimeout(searchT); searchT = setTimeout(() => search(e.target.value.trim()), 150); });
  function search(q) {
    if (q.length < 2) { route(); return; }
    setActive('');
    const ql = q.toLowerCase();
    const res = IDX.map(r => { const tl = r.title.toLowerCase(), tx = r.text.toLowerCase(); const s = (tl.includes(ql) ? 10 : 0) + (tx.includes(ql) ? 1 : 0); return { r, s }; }).filter(x => x.s).sort((a, b) => b.s - a.s).slice(0, 40);
    const hl = s => esc(s).replace(new RegExp(ql.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), m => `<mark>${m}</mark>`);
    const snip = t => { const i = t.toLowerCase().indexOf(ql); if (i < 0) return esc(t.slice(0, 140)) + '…'; const a = Math.max(0, i - 60); return (a ? '…' : '') + hl(t.slice(a, i + 110)) + '…'; };
    view.innerHTML = `<div class="sec-h" style="margin-top:0"><h2>Поиск: «${esc(q)}»</h2><p>${res.length} результатов</p></div>` + (res.length ? `<div class="sres">${res.map(({ r }) => `<a href="${r.href}" ${r.jump ? `data-jump="${r.jump}"` : ''}><b>${hl(r.title)}</b><small>${r.sub}</small><small>${snip(r.text)}</small></a>`).join('')}</div>` : '<p class="empty">Ничего не нашлось. Попробуй другое слово — например, «хронаксия» или «тетанус».</p>');
    view.querySelectorAll('[data-jump]').forEach(a => a.addEventListener('click', () => { pendingJump = a.dataset.jump; }));
  }
  let pendingJump = null;

  /* ---------- Маршрутизация ---------- */
  function route() {
    keyHandler = null;
    app.classList.remove('open');
    const h = (location.hash || '#home').slice(1);
    view.style.display = '';
    if (h === 'home' || h === '') viewHome();
    else if (h === 'graphs') viewGraphs('all');
    else if (h === 'graphs-must') viewGraphs('must');
    else if (h.startsWith('g-')) viewGraph(h.slice(2));
    else if (h === 'cards') viewCards();
    else if (h === 'quiz') viewQuiz();
    else if (h === 'wb') viewWB();
    else { const m = h.match(/^(t\d+)(?:-(g|c|q|z))?$/); if (m) viewTopic(m[1], m[2]); else viewHome(); }
    if (pendingJump) { const el = document.getElementById(pendingJump); pendingJump = null; if (el) setTimeout(() => el.scrollIntoView(), 30); }
    else window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', () => { $('#q').value = ''; route(); });
  route();
})();

</script>
